name: charity-market-postgres

services:
  database:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env.postgres}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env.postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.postgres}"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server:
    image: mmarannino/charity-market-server:postgres-1.0.0

    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    ports:
      - "${SERVER_PORT:-8088}:8088"

    environment:
      QUARKUS_PROFILE: "postgres"

      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8088"

      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}"

      QUARKUS_DATASOURCE_JDBC_URL: >-
        jdbc:postgresql://database:5432/${POSTGRES_DB}

      QUARKUS_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      QUARKUS_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"

      QUARKUS_DATASOURCE_JDBC_MIN_SIZE: "2"
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: "${POSTGRES_POOL_SIZE:-20}"

      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: "update"

      CHARITY_BOOTSTRAP_ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      CHARITY_BOOTSTRAP_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.postgres}"
      CHARITY_BOOTSTRAP_ADMIN_MUST_CHANGE_PASSWORD: "${ADMIN_MUST_CHANGE_PASSWORD:-true}"

      SMALLRYE_JWT_SIGN_KEY_LOCATION: "/run/secrets/jwt_private_key"
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: "/run/secrets/jwt_public_key"

    secrets:
      - jwt_private_key
      - jwt_public_key

volumes:
  postgres-data:
    name: charity-market-postgres-data

secrets:
  jwt_private_key:
    file: ./deploy/secrets/privateKey.pem

  jwt_public_key:
    file: ./deploy/secrets/publicKey.pem