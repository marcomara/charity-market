# =====================================================
# Common server configuration
# =====================================================

quarkus.application.name=charity-market-server

quarkus.http.host=0.0.0.0
quarkus.http.port=8088

charity.bootstrap.admin.username=admin
charity.bootstrap.admin.must-change-password=false

charity.settings.default-currency=EUR
charity.settings.auto-refresh-enabled=true
charity.settings.users-can-customize-auto-refresh=false
charity.settings.default-refresh-interval-seconds=10
charity.settings.minimum-refresh-interval-seconds=5
charity.settings.maximum-refresh-interval-seconds=15
charity.database.backup-directory=./data/backups

# Detect attempts to override build-time properties incorrectly.
quarkus.config.build-time-mismatch-at-runtime=fail

# =====================================================
# Development mode
# =====================================================

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=sa
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:charitymarket;DB_CLOSE_DELAY=-1

%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# =====================================================
# Test mode
# =====================================================

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:charitymarket-test;DB_CLOSE_DELAY=-1

%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.charity.bootstrap.admin.password=test-admin-password
%test.charity.database.backup-directory=target/database-backups

# =====================================================
# SQLite distribution
# =====================================================

%sqlite.quarkus.datasource.db-kind=sqlite
%sqlite.quarkus.datasource.jdbc.url=jdbc:sqlite:./data/charity-market.db
%sqlite.quarkus.datasource.jdbc.min-size=1
%sqlite.quarkus.datasource.jdbc.max-size=1

%sqlite.quarkus.hibernate-orm.schema-management.strategy=update


# =====================================================
# PostgreSQL packaged distribution
# =====================================================

%postgres.quarkus.datasource.db-kind=postgresql

# Friendly application properties.
%postgres.charity.db.host=localhost
%postgres.charity.db.port=5432
%postgres.charity.db.name=charitymarket
%postgres.charity.db.username=charitymarket
%postgres.charity.db.password=

# Quarkus datasource configuration.
%postgres.quarkus.datasource.jdbc.url=jdbc:postgresql://${charity.db.host}:${charity.db.port}/${charity.db.name}
%postgres.quarkus.datasource.username=${charity.db.username}
%postgres.quarkus.datasource.password=${charity.db.password}

%postgres.quarkus.datasource.jdbc.min-size=2
%postgres.quarkus.datasource.jdbc.max-size=20

%postgres.quarkus.hibernate-orm.schema-management.strategy=update


# =====================================================
# MySQL packaged distribution
# =====================================================

%mysql.quarkus.datasource.db-kind=mysql

%mysql.charity.db.host=localhost
%mysql.charity.db.port=3306
%mysql.charity.db.name=charitymarket
%mysql.charity.db.username=charitymarket
%mysql.charity.db.password=

%mysql.quarkus.datasource.jdbc.url=jdbc:mysql://${charity.db.host}:${charity.db.port}/${charity.db.name}?sslMode=REQUIRED&serverTimezone=UTC

%mysql.quarkus.datasource.username=${charity.db.username}
%mysql.quarkus.datasource.password=${charity.db.password}

%mysql.quarkus.datasource.jdbc.min-size=1
%mysql.quarkus.datasource.jdbc.max-size=5

%mysql.quarkus.hibernate-orm.schema-management.strategy=update


# =====================================================
# JWT authentication
# =====================================================

charity.jwt.issuer=charity-market-server
charity.jwt.access-token-seconds=900

smallrye.jwt.new-token.issuer=${charity.jwt.issuer}
smallrye.jwt.new-token.lifespan=${charity.jwt.access-token-seconds}

smallrye.jwt.sign.key.location=privateKey.pem

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=${charity.jwt.issuer}

# =====================================================
# HTTP authorization
# =====================================================

# Login is public.
quarkus.http.auth.permission.public-login.paths=/api/auth/login
quarkus.http.auth.permission.public-login.policy=permit

# Every other application API requires authentication.
quarkus.http.auth.permission.secured-api.paths=/api/*
quarkus.http.auth.permission.secured-api.policy=authenticated

# Container health checks remain public.
quarkus.http.auth.permission.health.paths=/q/health,/q/health/*
quarkus.http.auth.permission.health.policy=permit
